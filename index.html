<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature's Platter</title>
    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome cdn -->
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous" referrerpolicy="no-referrer">
  </head>
  <body>
    <!-- <h2 class="text-red-500 font-bold text-5xl">Nature's Platter</h2> -->

    <header class="bg-[#f1eee7]">
      <!-- <nav
        class="grid grid-cols-3 gap-4 justify-center bg-cyan-700 container mx-auto"> -->
      <nav
        class="grid grid-cols-3 gap-4 justify-center container mx-auto pt-4">
        <img src="./assets/nav-logo.png" alt class="w-[120px] h-auto">

        <ul class="flex gap-4 items-center">
          <li><a href>Products</a></li>
          <li><a href>Services</a></li>
          <li><a href>Contact Us</a></li>
        </ul>

        <div class="flex gap-4 items-center">
          <span><i class="fa-solid fa-magnifying-glass"></i></span>
          <span><i class="fa-solid fa-cart-shopping"></i></span>
          <!-- <button class="rounded border-l-2 border-green-500 px-3 py-1">Log
            In</button>
          <button class="rounded border-x-2 border-green-500 px-3 py-1">Log
            In</button> -->
          <button
            class="rounded border border-green-500 px-3 py-1">Login</button>
          <button
            class="rounded bg-green-500 text-white px-3 py-1">Register</button>
        </div>
      </nav>
      <!-- Hero/Banner Section Starts Below -->
      <section class="text-center pt-[20px]">
        <!-- <div class="max-w-[40%]"> -->
        <div class="max-w-[40%] mx-auto">
          <!-- h2 and p (title and description) have a max-width -->
          <h2 class="font-bold text-4xl mb-4">Freshness <span
              class="text-green-500">You Can<br>
              Count</span> On, Prices You'll Love!</h2>
          <p>Shop your daily essentials at unbeatable prices. From fresh produce
            to
            healthy <br> staples, we've got you covered every day!
          </p>
        </div>

        <img src="./assets/Hero Section-large.png" alt
          class="mx-auto max-w-[920px] h-auto">
      </section>
    </header>

  </body>
</html>
